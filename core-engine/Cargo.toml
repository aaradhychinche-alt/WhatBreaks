[package]
name = "wb-core-engine"
version = "0.1.0"
edition = "2021"
description = "WhatBreaks Core Engine – provider-agnostic infrastructure entity model"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# No additional test dependencies needed; std test harness is sufficient.
